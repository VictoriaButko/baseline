name: Pull request title

# Every pull request is squash-merged, and the squash commit takes the title
# of the pull request, so the title has to be a valid commit subject:
# type(scope): subject — see CONTRIBUTING.md. Only pull requests into main are
# checked: a student's pull request into a lab branch gets its title from the
# teacher at merge time.
#
# The check runs on the title alone and needs no checkout.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  check:
    name: Title is a commit subject
    runs-on: ubuntu-latest

    steps:
      - name: Check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|refactor|content|reports|docs|ci|chore'
          format="^($types)(\([a-z0-9-]+\))?!?: [a-z0-9]"

          fail() {
            echo "::error::$1"
            echo
            echo "Title: [$TITLE]"
            echo "Format: type(scope): subject — type is one of $types,"
            echo "scope is optional and lowercase, subject starts lowercase, no trailing period,"
            echo "at most 72 characters in all. See CONTRIBUTING.md."
            exit 1
          }

          # A space pasted in with the title is invisible on the pull request
          # page, so it gets its own message rather than a format error.
          case "$TITLE" in
            [[:space:]]*|*[[:space:]]) fail "The title starts or ends with whitespace." ;;
          esac
          printf '%s' "$TITLE" | grep -Eq "$format" \
            || fail "The title is not 'type(scope): subject' with a known type."
          case "$TITLE" in
            *.) fail "The title ends with a period." ;;
          esac
          [ "${#TITLE}" -le 72 ] \
            || fail "The title is ${#TITLE} characters; the limit is 72."

          echo "OK: $TITLE"
